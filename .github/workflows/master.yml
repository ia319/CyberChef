name: "Master Build, Test & Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  main:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the officially supported version; Node 26 is tested
        # ahead of it becoming the active LTS release (see #2397)
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: |
          npm ci
          npm run setheapsize

      - name: Lint
        run: npx grunt lint

      - name: Unit Tests
        run: |
          npm test
          npm run testnodeconsumer

      - name: Production Build
        if: success()
        run: npx grunt prod --msg=""

      - name: Setup Chrome
        id: setup-chrome
        if: success()
        run: |
          npx @puppeteer/browsers install chrome@152
          chrome_binary="$(find "$GITHUB_WORKSPACE/chrome" -type f -name chrome -print -quit)"
          test -x "$chrome_binary"
          echo "chrome-binary=$chrome_binary" >> "$GITHUB_OUTPUT"

      - name: Configure Chrome Sandbox
        if: success()
        env:
          CYBERCHEF_TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-binary }}
        run: |
          profile_path="/etc/apparmor.d/cyberchef-chrome-for-testing"
          cat <<EOF | sudo tee "$profile_path" > /dev/null
          abi <abi/4.0>,
          include <tunables/global>

          profile cyberchef-chrome-for-testing "$CYBERCHEF_TEST_CHROME_BINARY" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$profile_path"

      - name: UI Tests
        if: success()
        env:
          CYBERCHEF_TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-binary }}
        run: |
          sudo apt-get install xvfb
          xvfb-run --server-args="-screen 0 1200x800x24" npx grunt testui

      - name: WebMCP Tests
        if: success()
        env:
          CYBERCHEF_TEST_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-binary }}
        run: |
          xvfb-run --server-args="-screen 0 1200x800x24" npm run testwebmcp

      - name: Deploy to GitHub Pages
        if: success() && github.ref == 'refs/heads/master' && matrix.node-version == 24
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: gh-pages
          build_dir: ./build/prod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
